# Replace hotdata.example with your verified domain and provision the TLS files first.
# Install inside nginx's http context; keep port 3000 bound to loopback.
limit_req_zone $binary_remote_addr zone=hotdata:10m rate=20r/s;
server {
  listen 80;
  server_name hotdata.example;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name hotdata.example;
  ssl_certificate /etc/letsencrypt/live/hotdata.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hotdata.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 3m;
  client_body_timeout 15s;
  server_tokens off;
  location / {
    limit_req zone=hotdata burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_cache off;
  }
}
