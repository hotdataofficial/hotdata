[build]
  command = "node scripts/prepare-netlify.mjs && npm run db:generate && node scripts/check-netlify-runtime.cjs && node scripts/check-live-readiness.cjs && npm run build"
  publish = ".next"
[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Public enum values, not credentials; keep scanning all real secrets.
  SECRETS_SCAN_OMIT_KEYS = "HOTDATA_WORKER_MODE,PAYMENT_GATEWAY"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "argon2"]
  included_files = ["node_modules/.prisma/client/**"]
[context.deploy-preview.environment]
  HOTDATA_WORKER_MODE = "disabled"
  KORAPAY_ALLOW_LIVE = "false"
  GSUBZ_ALLOW_LIVE = "false"
[context.branch-deploy.environment]
  HOTDATA_WORKER_MODE = "disabled"
  KORAPAY_ALLOW_LIVE = "false"
  GSUBZ_ALLOW_LIVE = "false"

# Netlify serves this static offline document without passing through Next.js.
[[headers]]
  for = "/offline.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
